[project]
name = "bort"
version = "0.1.0"
description = "Recurrent ModernBERT-style masked-language-model research"
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"

dependencies = [
    "torch==2.11.0",
    "triton==3.6.0; sys_platform == 'linux'",
    "triton-windows>=3.6,<3.7; sys_platform == 'win32'",
    "transformers==5.22.2",
    "datasets>=4,<5",
    "accelerate>=1,<3",
    "safetensors>=0.6,<1",
    "huggingface-hub>=0.35,<2",
    "einops>=0.8,<1",
    "numpy>=1.26,<3",
    "pyarrow>=18",
    "tqdm>=4.66,<5",
    "jupyterlab>=4,<5",
    "ipykernel>=6,<8",
]

[project.optional-dependencies]
linux-fa2 = [
    "flash-attn==2.8.3.post1+cu.12.8.torch.2.11; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "matplotlib>=3.9,<4",
    "protobuf>=7.36.2",
    "pytest>=8,<10",
    "pytest-timeout>=2.4.0",
    "ruff>=0.12",
    "sentencepiece>=0.2.3",
    "tiktoken>=0.14.0",
]
hw = [
    "openvino>=2026.4.1",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.pytest.ini_options]
timeout = 300
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["gpu: needs CUDA and the real ModernBERT-large teacher"]
# The GPU tests write real checkpoints (2.7 GB each) into tmp_path: keep a test's directory only if it failed, or each run leaves ~30 GB behind.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
flash-attn = { index = "astral-cu128", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "astral-cu128"
url = "https://wheels.astral.sh/simple/cu128/"
explicit = true

[tool.ruff]
line-length = 120
src = ["src", "tests"]
extend-exclude = ["src/arch.py"]  # the author's file: tooling must not rewrite it

[tool.ruff.lint]
ignore = ["C408"]  # dict(key=value) is the clearer spelling for config / record literals
